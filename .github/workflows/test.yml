name: Teste GlitchCoin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Sintaxă JS
        run: node --check app.js && node --check data.js && node --check scripts/verifica-date.mjs
      - name: Coerența datelor
        run: node scripts/verifica-date.mjs
      - name: Teste unitare
        run: node --test tests/
